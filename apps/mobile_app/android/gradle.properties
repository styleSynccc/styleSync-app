# -Xmx8G (the Flutter template default) is larger than this machine's total
# RAM (7GB total - confirmed via the JVM crash log's "Host:" line), so the
# daemon reliably OOM-crashed with a native "mmap failed" error before any
# real build error could even surface. Capped to fit with room for the OS,
# IDE, and everything else actually running on this machine.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvm.options=-Xmx1536m
# Kotlin's incremental compiler tries to compute a path relative to this
# project (D:\...) for plugin source files that live in the Pub cache (C:\...
# AppData\...\Pub\Cache - a different drive letter). Windows can't express a
# relative path across drives ("this and base files have different roots"),
# which crashed the build on image_picker_android. Incremental compilation
# is what hits that code path, so it's off; rebuilds are just slower.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
